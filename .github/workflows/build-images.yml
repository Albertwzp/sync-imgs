name: Build and push Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      folder:
        description: Folder containing the Dockerfile to build (leave empty to use changed Dockerfiles)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create build matrix
        id: matrix
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLDER: ${{ inputs.folder || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          matrix='[]'
          declare -A image_names=()

          if [[ -n "${INPUT_FOLDER}" ]]; then
            folder="${INPUT_FOLDER%/}"
            if [[ "${folder}" == "." ]]; then
              dockerfiles=("Dockerfile")
            else
              dockerfiles=("${folder}/Dockerfile")
            fi

            if [[ ! -f "${dockerfiles[0]}" ]]; then
              echo "::error::No Dockerfile found in folder '${INPUT_FOLDER}'."
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            mapfile -t dockerfiles < <(find . -type f -name Dockerfile -not -path './.git/*' -printf '%P\n' | sort)
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            mapfile -t dockerfiles < <(git ls-tree -r --name-only "${CURRENT_SHA}" -- '*Dockerfile' | sort)
          else
            mapfile -t dockerfiles < <(
              git diff --name-only --diff-filter=ACMR "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'Dockerfile' '**/Dockerfile' \
                | while IFS= read -r dockerfile; do
                    [[ -f "${dockerfile}" ]] && printf '%s\n' "${dockerfile}"
                  done
            )
          fi

          while IFS= read -r relative_dockerfile; do
            [[ -n "${relative_dockerfile}" ]] || continue
            context="$(dirname "${relative_dockerfile}")"

            if [[ "${context}" == "." ]]; then
              source_name="${REPOSITORY_NAME}"
            else
              source_name="${context//\//-}"
            fi

            image="$(printf '%s' "${source_name}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"

            if [[ -z "${image}" ]]; then
              echo "::error file=${relative_dockerfile}::The Dockerfile path cannot be converted to a valid image name."
              exit 1
            fi

            if [[ -n "${image_names[${image}]:-}" ]]; then
              echo "::error::Dockerfiles '${image_names[${image}]}' and '${relative_dockerfile}' map to the same image name '${image}'."
              exit 1
            fi
            image_names["${image}"]="${relative_dockerfile}"

            matrix="$(jq -c \
              --arg context "${context}" \
              --arg dockerfile "${relative_dockerfile}" \
              --arg image "${image}" \
              '. + [{context: $context, dockerfile: $dockerfile, image: $image}]' \
              <<< "${matrix}")"
              done < <(printf '%s\n' "${dockerfiles[@]}" | sort -u)

          count="$(jq 'length' <<< "${matrix}")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(jq -c '{include: .}' <<< "${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "Discovered ${count} Dockerfile(s)."

  build:
    name: Build ${{ matrix.image }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
